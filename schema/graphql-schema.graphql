}

# Describes a standardized, controlled vocabulary representing a specific scientific idea.
type Concept {
    # Authority File Key (AFK)—unique identifier of the vocabulary entry record associated with this concept.
    afk: String
    # Substance linked to this concept (present when the vocabulary entry represents or is associated with a registered substance).
    substance: Substance
