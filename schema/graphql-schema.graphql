# 8. REACTIONS
# Source file: reaction.graphqls
# CAS-indexed reaction domain: reactionQuery, ReactionInput (participants, conditions, transformations), the Reaction type (stages, procedure, products), and the full ReactionTransformation named-reaction enum.
# ================================================================================

extend type Query {
    # Searches CAS-indexed chemical reactions by internal reaction ID, reaction type (full/half/failed), named transformation, participants, reaction scheme, or entry date. Returns matching reactions including products, stages, procedure text, and scale.
    reactionQuery(reactionInput: [ReactionInput], pageParameters: PageParameters): ReactionPage
}

# Defines search inputs to query reactions.  Multiple inputs are evaluated with AND by default.
input ReactionInput {
    # Unique internal identifier for the reaction (may be legacy or system-generated).
    id: String
    # Date the reaction became available (entry to the system or database).
    entryDate: DateRange @ValidateRange
    # Reaction type classification: full, half, or failed.
    reactionType: ReactionType
    # Participant in a reaction.
    reactionParticipant: [ReactionParticipantInput] @ValidateReactionParticipant
    # Named transformation(s) assigned to the reaction (e.g., “Reduction of Nitro Compounds to Amines”).
    transformations: [ReactionTransformation]
    # Required reaction scheme representing products=reactants.
    scheme: String
    # Author-described experimental procedure text and related data.
    reactionNote: String
    # Conditions (temperature, pressure, pH, duration) applied within this stage.
    conditions: ConditionInput
}

# Query reactions by substances involved in the reaction. Multiple inputs are evaluated with AND by default.
input ReactionParticipantInput {
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Auxiliary descriptor or textual modifier (AMD) describing a non-structurable derivative.
    modifier: String
    # Role of the participant in the reaction (reactant contributes carbon; reagent does not; catalyst accelerates; solvent medium).
    role: ReactionRole
    # Display or reported yield value (percent; whole number, 0 < value ≤ 100).
    yield: FloatRange @ValidateRange
    # Search this participant by chemical structure. Combined with role, only matches a participant satisfying both.
    structure: SubstanceStructureInput @ValidateStructureInput
}

enum ReactionRole {
    PRODUCT
    REACTANT
    REAGENT
    CATALYST
    SOLVENT
}

# Query reactions by experimental conditions as described by the author or publication.
input ConditionInput {
    # pH value or range; numeric or shorthand (acidified/basified/neutralized).
    ph: FloatRange @ValidateRange
    # Pressure value or range (e.g., atm, bar, psi).
    pressure: PressureInput
    # Temperature value or range (e.g., °C default; rt ≈ ambient).
    temperature: TemperatureInput
    # Duration value or range (e.g., h, min, s; “overnight” shorthand permissible).
    duration: DurationInput
}

# Query reactions by the pressure condition when reported by the author or publication.
input PressureInput {
    value: FloatRange @ValidateRange
    unit: PressureUnit
}

enum PressureUnit {
    ATM
    BAR
    BARG
    GPA
    HPA
    KBAR
    KG_CM2
    KPA
    MBAR
    MM_HG
    MPA
    PA
    PSI
    PSIG
    TORR
}

# Query reactions by the temperature condition when reported by the author or publication.
input TemperatureInput {
    value: FloatRange @ValidateRange
    unit: TemperatureUnit
}

enum TemperatureUnit {
    CELSIUS
    FAHRENHEIT
    KELVIN
    RANKINE
}

input DurationInput {
    value: FloatRange @ValidateRange
    unit: DurationUnit
}

enum DurationUnit {
    MILLISECONDS
    SECONDS
    MINUTES
    HOURS
    DAYS
    WEEKS
    MONTHS
}

input ReactionStructureInput {
    # Base64 encoded CXF representing the full reaction scheme.
    CXF: String
    # Reaction SMILES in the following formats are accepted: rct>>prd; rct.rct>>prd.prd; rct>rgt>prd; rct>>; >>prd
    reactionSMILES: String
    searchType: ReactionSearchType
}

enum ReactionType {
    FULL
    HALF
    FAILED
}

enum ReactionSearchType {
    AS_DRAWN
    SUBSTRUCTURE
}

# Describes a chemical transformation process.
type Reaction {
    # Unique internal identifier for the reaction (may be legacy or system-generated).
    id: String
    # Public display and searchable identifier for a single step reaction.
    publicIdentifier: String
    # Date the reaction became available (entry to the system or database).
    entryDate: String
    # Contractual or source attribution statement for reactions from specific publications.
    attribution: String
    # Reaction type classification: full, half, or failed.
    reactionType: ReactionType
    # The source document associated with the reaction.
    document: Document
    # Products of the reaction; each product is a substance (contains at least one carbon), with yield details.
    products: [ReactionProduct]
    # Ordered stages capturing significant experimental events (participant additions, quench, pH changes, etc.).
    stages: [ReactionStage]
    #  Author-described experimental procedure text and related data.
    procedure: ReactionProcedure
    #  Reaction Materials and/or equipment noted by the author at stage-level significance (e.g., Dean–Stark, autoclave).
    reactionMaterial: [ReactionMaterial]
    #  Provided by primary source by author, small to large scale (e.g. milligram).
    scaleDescription: String
    # milligram (mg), gram (g), or kilogram (kg).
    scaleValue: String
    # Required reaction scheme representing products=reactants.
    scheme: String!
    # Notes about selectivity, named reactions, energy/techniques, or other controlled/free-form scope notes.
    reactionNote: String
    # Named transformation(s) assigned to the reaction (e.g., “Reduction of Nitro Compounds to Amines”).
    transformations:[Transformation]
    # Atom economy metric (value, unit, and derivation may be captured separately).
    atomEconomy: String
}

# Describes classification of reaction based on nature of the change (e.g., oxidation, halogenation, etc.)
type Transformation {
    # Transformation identifier.
    id: String
    # SVG image for the transformation group.
    svg: String
    # Descriptive transformation group name.
    name: ReactionTransformation
}

# Describes a distinct chemical reaction step with specific conditions.
type ReactionStage {
    # Stage order number (sequential, starting at 1).
    stage: Int
    # Participants in this stage: reactants, reagents, catalysts, solvents.
    reactants: [ReactionParticipant]
    # Participants in this stage: reactants, reagents, catalysts, solvents.
    solvents: [ReactionParticipant]
    # Participants in this stage: reactants, reagents, catalysts, solvents.
    catalysts: [ReactionParticipant]
    # Participants in this stage: reactants, reagents, catalysts, solvents.
    reagents: [ReactionParticipant]
    # Conditions (temperature, pressure, pH, duration) applied within this stage.
    conditions: [Condition]
}

# Substances involved in the reaction (e.g., reactant, catalyst, etc.)
type ReactionParticipant {
    # Substance involved in the stage.
    substance: Substance
    # Auxiliary descriptor or textual modifier (AMD) describing a non-structurable derivative.
    modifier: String
}

# Product of the reaction.
type ReactionProduct {
    # Display or reported yield value (percent; whole number, 0 < value ≤ 100).
    yield: String
    # Substance instance for the product (contains at least one carbon).
    substance: ReactionParticipant
}

# Describes experimental parameters as described by the author in the original publication.
type Condition {
    # Order number of the condition within the stage (sequential, starting at 1).
    ordinal: Int!
    # pH value or range; numeric or shorthand (acidified/basified/neutralized).
    ph: String
    # Pressure value or range (e.g., atm, bar, psi).
    pressure: String
    # Temperature value or range (e.g., °C default; rt ≈ ambient).
    temperature: String
    # Duration value or range (e.g., h, min, s; “overnight” shorthand permissible).
    duration: String
}

# The ordered steps associated with completing a chemical reaction.
type ReactionProcedure {
  #  Title or heading of the procedure segment.
  title: String
  #  Procedure text as described in the publication.
  procedure: String
  #  Free-form experimental data describing product characterization (e.g., NMR, LC-MS).
  experimentalData: String
  #  Steps as a part of a reaction procedure
  procedureSteps: [ProcedureStep]
  #  Characterization data for products (e.g., NMR entries).
  characterizationData: [ProductCharacterization]
  #  Safety notes provided by the author (e.g., pressure cautions, blast shield).
  safetyInformation: [String]
}
# A discrete step within a procedure.
type ProcedureStep {
  #  Defines the order of the steps.
  stepNumber: String
  #  Detailed description of the step.
  description: String
}
# Describes a measurement or analysis to validate the product of a reaction.
type ProductCharacterization {
  #  Substance to which the characterization applies.
  substance: Substance
  #  Characterization text (e.g., “1H NMR (500 MHz, CDCl3) …”).
  text: String
  #  Characterization type label (e.g., NMR, IR, MS).
  type: String
}
# Describes equipment used in a procedure (e.g., glassware, labkits, etc.)
type ReactionMaterial {
  substance: Substance
  concept: [Concept]
  #  Item needed to conduct a test method (e.g. 10 mm test tube).
  description: String
}

