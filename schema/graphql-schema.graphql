# 6. SUBSTANCES
# Source file: substance.graphqls
# Core substance registry domain: substanceQuery, SubstanceInput/SubstanceStructureInput, the Substance interface, and its concrete implementations (SingleComponentSubstance, MultiComponentSubstance, AlloySubstance, TabularInorganicSubstance) plus their shared component/structure types.
# ================================================================================

extend type Query {
    # Searches the CAS Registry for substances by identifying criteria (RN, name, molecular formula/weight, InChIKey, structure, substance class, component RN), and returns only those substances that also satisfy any supplied property, hazard, document, or catalog criteria — e.g., a given molecular formula and a boiling point in a given range, or a given RN and an H225 hazard designation. Returns matching substance records with registry data, names/synonyms, classifications, and related information.
    substanceQuery(
        substanceInput: [SubstanceInput]
        propertyInput: [PropertyInput]
        hazardInput: [HazardInput]
        documentInput: [DocumentInput]
        catalogInput: [CatalogInput]
        pageParameters: PageParameters
    ): SubstancePage
}

# Defines search inputs to query substances.  Multiple inputs are evaluated with AND by default.
input SubstanceInput {
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Chemical name of a substance to be searched.
    name: String
    # Primary or alternate molecular formula expressed in Hill order; may include parentheses for polymers.
    molecularFormula: String
    # Molecular weight of the substance in grams per mole (g/mol).
    molecularWeight: FloatRange @ValidateRange
    # Number of unique structural components making up the substance.
    numberOfComponents: IntegerRange @ValidateRange
    # Date the substance was first entered into the Registry.
    entryDate: DateRange @ValidateRange
    # Date the substance record was last updated.
    lastUpdateDate: DateRange @ValidateRange
    # Date the structural representation was last updated.
    lastStructureUpdateDate: DateRange @ValidateRange
    # Substance classifications (e.g., polymer, alloy, manual registration).
    substanceClasses: [SubstanceClass]
    # InChIKey condensed representation of the InChI.
    inchiKey: String
    # CAS Registry Number assigned to a component in a multicomponent substance.
    componentRN: String
    # Connection table for a substance using several different formats.
    structure: SubstanceStructureInput @ValidateStructureInput
}

# Defines structure search input formats to query substances.
input SubstanceStructureInput {
    # CAS proprietary structure connection file format.
    CXF: String
    # Textual representation of a connection table.
    molFile: String
    # Linear text format for representing chemical structure
    SMILES : String
    # Text based digital signature for representing chemical structure
    inchi: String
    # Type of structure search (e.g., As Drawn, Substructure)
    searchType: StructureSearchType
}

# Describes the chemically discrete and identifiable compound.
interface Substance {
    # Source of registration of the substance (e.g. CA, Chemical Catalog Supplier).
    source: String!
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Primary molecular formula expressed in Hill order; may include parentheses for polymers.
    molecularFormula: String
    # Alternate molecular formula or descriptive variant; may include parentheses for polymers.
    altMolecularFormula: String
    # Molecular weight of the substance in grams per mole (g/mol).
    molecularWeight: String
    # CAS preferred name for the substance.
    preferredName: String
    # Recommended display name by CAS; often the common name or uninverted name.
    displayName:    String
    # Uninverted name form sometimes used for display purposes
    uninvertedName: String
    # Common or trivial name for the substance.
    commonName: String
    # Other synonyms associated with the substance
    otherSynonyms: [String]
    # Number of unique structural components making up the substance.
    numberOfComponents: Int
    # Registry numbers that have been deleted but remain linked to this substance.
    deletedRN: String
    # Alternate registry numbers associated with the substance.
    alternateRN: String
    # Preferred registry number with preferred structural representation.
    preferredRN: String
    # Note providing additional descriptive information about the substance.
    note: String
    # Date the substance was first entered into the Registry.
    entryDate: String
    # Date the substance record was last updated.
    lastUpdateDate: String
    # Date the structural representation was last updated.
    lastStructureUpdate: String
    # Structured textual descriptor capturing stereo or other details not in the connection table.
    textDescriptor:String
    # Substance classifications (e.g., polymer, alloy, manual registration).
    substanceClasses: [SubstanceClass]
    # Document findings (including roles, modifiers, etc.) associated with this substance.
    substanceFindingPage(pageParameters: PageParameters): SubstanceFindingPage
    # Related substances grouped by relationship type (e.g., stereoisomer, linked polymer).
    relatedSubstances: [RelatedSubstance]
    # Hazard designations associated with the substance.
    hazardDesignationPage(pageParameters: PageParameters): HazardDesignationPage
    # Catalogs referencing this substance.
    catalogItemPage(pageParameters: PageParameters): CatalogItemPage
    # Properties associated with the substance (physical, chemical), including experimental and predicted.
    propertyPage(pageParameters: PageParameters): PropertyPage
}

enum SubstanceClass {
    ALLOY
    COORDINATION_COMPOUND
    ELEMENT
    GENERIC_REGISTRATION
