# 11. COMMERCIAL CATALOGS
# Source file: catalog.graphqls
# Supplier catalog domain: catalogQuery, CatalogInput, CatalogItem and its component/offering/distributor types, and related availability/purity/quantity enums.
# ================================================================================

extend type Query {
    # Searches commercial supplier catalog listings for a substance by CAS Registry Number, supplier name, purity, quantity, availability/stock status, or shipping timeframe. Returns matching catalog items (product name, pricing/quantity offerings, purity, supplier links, and the linked substance).
    catalogQuery (catalogInput: [CatalogInput], pageParameters: PageParameters): CatalogItemPage
}

# Describes the search inputs to query catalogs. Multiple inputs are evaluated with AND by default.
input CatalogInput {
        # Unique CAS Registry Number assigned to the substance.
        RN: String
        # Supplier name as provided for the catalog item or issue.
        supplierName: String
        # Flag indicating whether bulk quantities are available.
        isBulkAvailable: Boolean
        # Flag indicating whether the item is categorized as a screening compound.
        isScreeningCompound: Boolean
        # Purity statement as reported (e.g., 99%, 98% GC, 97ee, Ta < 500 ppm).
        purityCategory: Purity
        # Supplier-indicated time frame for shipment readiness (e.g., 1 week, 2 weeks).
        shipsWithin: ShipsWithin
        # Quantity text as reported (number + unit), e.g., “10 mg”, “100 mL”, or formatted packs.
        quantity: String
        # Quantity category for sorting/grouping (e.g., Milligram, Gram, Kilogram quantities, Tons).
        quantityCategory: QuantityCategory
        # Stock status at the time of the catalog update (e.g., Maintained in stock, Typically in stock, Limited/intermittent, Synthesis on demand).
