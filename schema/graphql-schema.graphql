# 7. BIOSEQUENCES
# Source file: biosequence.graphqls
# Nucleic-acid and protein/peptide sequence domain: biosequenceQuery, BiosequenceInput, the Biosequence type (implements Substance & StructureRepresentation), strand/modification detail types, GenBank data, and patent sequence annotations.
# ================================================================================

extend type Query {
    # Searches CAS-registered biosequences (nucleic acids and proteins/peptides) by identifying criteria (RN, name, sequence, substance class, strand count/length, modification status), and returns only those biosequences that also satisfy any supplied hazard, document, or catalog criteria — e.g., a sequence match that's also commercially available in a supplier catalog, or that carries a specific hazard designation. Returns matching biosequence records with registry data, strand/modification details, and related structures.
    biosequenceQuery(
        biosequenceInput: [BiosequenceInput],
        hazardInput: [HazardInput]
        documentInput: [DocumentInput]
        catalogInput: [CatalogInput]
        pageParameters: PageParameters
    ): BiosequencePage
}

# Defines search inputs to query biosequences.  Multiple inputs are evaluated with AND by default.
input BiosequenceInput {
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Chemical name of a substance to be searched.
    name: String
    # Nucleic Acid or Protein Peptide Substance Class
    biosequenceSubstanceClass: BiosequenceSubstanceClass
    # Date the substance was first entered into the Registry.
    entryDate: DateRange
    # Date the substance record was last updated.
    lastUpdateDate: DateRange
    # Date the structural representation was last updated.
    lastStructureUpdateDate: DateRange
    # Total length of the biosequence in base units.
    totalLength: IntegerRange
    # Number of strands in the biosequence.
    numberOfStrands: IntegerRange
    # Length of the strand in base units.
    strandLength: [IntegerRange]
    # Sequence string representing nucleic acids or amino acids.
    sequence: String
    # Flag indicating if the biosequence is modified or not.
    modified: Boolean
    # Type of modification applied to the sequence.
    modification: [BioSequenceModificationDefinition]
}

# Defines the modifications of a biosequence.  This can be an array input with multiple modifications specified. Multiple inputs are evaluated with AND by default.
input BioSequenceModificationDefinition {
    # The type of modification to the biosequence.
    modificationType: SequenceModificationType
    # Text consisting of the locant and terms describing the modification.
    modificationDescription: String
    # An abbreviation representing the name of the amino acid or nucleic acid residue at the modified position.
    residue: String
    # Position of the residue containing the modification.
    position: String
}

enum SequenceModificationType {
    DNA_CONTAINING
    PNA_CONTAINING
    RNA_CONTAINING
    BRIDGE
    COMPLEX
    COPOLYMER
    COVALENT_BRIDGE
    HOMOPOLYMER
    LABELED
    METAL_COMPLEX
    MODIFICATION
    MODIFIED_BASE
    MODIFIED_LINK
    POLYA_CONTAINING
    RADICAL_ION
    REPLACEMENT
    STEREO
    STEREOISOMER
    TERMINAL_MOD
    UNCOMMON
    UNCOMMON_BASE
    UNCOMMON_LINK
}

enum BiosequenceSubstanceClass {
    NUCLEIC_ACID_SEQUENCE
    PROTEIN_PEPTIDE_SEQUENCE
}

# A series of nucleotides or amino acids that encodes information in a biological system.
type Biosequence implements Substance & StructureRepresentation {
    # Source of registration of the substance (e.g. CA, Chemical Catalog Supplier).
    source: String!
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Primary molecular formula expressed in Hill order; may include parentheses for polymers.
    molecularFormula: String
    # Alternate molecular formula or descriptive variant; may include parentheses for polymers.
    altMolecularFormula: String
    # Molecular weight of the substance in grams per mole (g/mol).
    molecularWeight: String
    # CAS preferred name for the substance.
    preferredName: String
    # Recommended display name by CAS; often the common name or uninverted name.
    displayName: String
    # Uninverted name form sometimes used for display purposes
    uninvertedName: String
    # Common or trivial name for the substance.
    commonName: String
    # Other synonyms associated with the substance
    otherSynonyms: [String]
    # Number of unique structural components making up the substance.
    numberOfComponents: Int
    # Registry numbers that have been deleted but remain linked to this substance.
    deletedRN: String
    # Alternate registry numbers associated with the substance.
    alternateRN: String
    # Preferred registry number with preferred structural representation.
    preferredRN: String
    # Note providing additional descriptive information about the substance.
    note: String
    # Date the substance was first entered into the Registry.
    entryDate: String
    # Date the substance record was last updated.
    lastUpdateDate: String
    # Date the structural representation was last updated.
    lastStructureUpdate: String
    # Structured textual descriptor capturing stereo or other details not in the connection table.
    textDescriptor:String
    # Substance classifications (e.g., polymer, alloy, manual registration).
    substanceClasses: [SubstanceClass]
    # Document findings (including roles, modifiers, etc.) associated with this substance.
    substanceFindingPage(pageParameters: PageParameters): SubstanceFindingPage
    # Related substances grouped by relationship type (e.g., stereoisomer, linked polymer).
    relatedSubstances: [RelatedSubstance]
    # Hazard designations associated with the substance.
    hazardDesignationPage(pageParameters: PageParameters): HazardDesignationPage
    # Catalogs referencing this substance.
    catalogItemPage(pageParameters: PageParameters): CatalogItemPage
    # Properties associated with the substance (physical, chemical), including experimental and predicted.
    propertyPage(pageParameters: PageParameters): PropertyPage
    # Canonical SMILES string representing the structure.
    canonicalSmiles: String
    # Isomeric SMILES string including stereochemistry and isotopic labeling
    isomericSmiles: String
    # InChI string representation of the structure.
    inchi: String
    # InChIKey condensed representation of the InChI.
    inchiKey: String
    # Molfile representation in V2000 format.
    molFileV2: String
    # Molfile representation in V3000 format.
    molFileV3: String
    # Image representation of the structure (SVG format).
    images: [String]
    # Total length of the biosequence in base units.
    totalLength: Int!
    # Morphology descriptor for the biosequence (e.g., multistranded, multi-chain).
    morphology: String
    # Strands making up the biosequence.
    biosequenceStrands:[BiosequenceStrand]
    # Modifications applied to the biosequence.
    modifications: [BiosequenceModification]
    # Patent annotations associated with the biosequence.
    patentAnnotations: [PatentAnnotation]
    # Note providing additional information about the biosequence.
    biosequenceNote: String
    # Counts of nucleic acid bases in the sequence.
    nucleicAcidCounts:[NucleicAcidCount]
    # GenBank information associated with the biosequence.
    genbankInformation: [GenbankInformation]
}

# Single linear chain of nucleotides or amino acids making up a biosequence.
type BiosequenceStrand {
    # Strand number identifying the strand.
    strandNumber: Int!
    # Length of the strand in base units.
    length: Int!
    # Sequence string representing nucleic acids or amino acids.
    sequence: String!
    # Type of strand (e.g., RNA, DNA).
    type: String
    # Topology of the strand (e.g., linear, cyclic).
    topology: String!
}

# Specific alteration to a nucleotide or amino acid biosequence or to a residue within that biosequence.
type BiosequenceModification {
    # Type of modification applied to the sequence.
    type: String!
    # Description of the modification.
    description: String
    # Display location of the modification.
    displayLocation: String
    # Residue involved in the modification.
    residue: String
    # Position of the modification in the sequence.
    position: Int
    # Strand number where the modification occurs.
    strandNumber: Int
    # Count of occurrences of this modification.
    occurrenceCount: Int
    # Additional targets involved in the modification.
    modificationTargets: [ModificationTarget]
}

# Identifies where a modification is applied, not the modification itself.
type ModificationTarget {
    # Residue involved in the modification target.
    residue: String
    # Position of the modification target.
    position: Int
    # Strand number of the modification target.
    strandNumber: Int
}

# Identifies where in the patent the biosequence was located.
type PatentAnnotation {
    # Reference containing patent number and sequence ID information.
    reference: String!
    # Source of the biosequence in the patent.
    source: String
    # Features associated with the patent annotation.
    annotationFeatures: [AnnotationFeature]
}

# If present, must contain one of these attributes.
type AnnotationFeature {
    # Feature name associated with the annotation.
    feature: String
    # Location of the feature in the sequence.
    location: String
    # Description of the feature.
    description: String
}

# Count of each base associated with a nucleic acid.
type NucleicAcidCount {
    # One-letter symbol representing a nucleic acid base.
    baseSymbol: String!
    # Count of the nucleic acid base present in the sequence.
    baseCount: Int!
}

# Refers to publicly available biological sequence data stored in GenBank.
type GenbankInformation {
    # GenBank accession number for the sequence.
    accessionNumber: String!
    # GenBank version identifier.
    version: String
    # Definition of the sequence from GenBank.
    definition: String
    # Organism name associated with the sequence.
    organismName: String
    # Taxonomic terms associated with the sequence.
    taxons: [String]
    # Features associated with the sequence.
    feature: [GenbankFeature]
}

# An annotated element within a nucleotide sequence record that identifies a specific biological region and attributes.
type GenbankFeature {
    # Key describing the type of feature.
    key: String
    # Location of the feature in the sequence.
    location: String
    # Qualifiers providing additional information about the feature.
    qualifier: String
}
