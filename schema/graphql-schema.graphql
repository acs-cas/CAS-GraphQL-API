# 3. SHARED RANGE INPUTS
# Source file: range.graphqls
# Reusable range input types (FloatRange, IntegerRange, DateRange) used across query inputs wherever a bounded or inclusive value range can be searched.
# ================================================================================

# Represents Float Range input with Boolean inclusive constraints.
input FloatRange {
    high: Float
    low: Float
    value: Float
    inclusive: Boolean = true
}

# Represents Integer Range input with Boolean inclusive constraints.
input IntegerRange {
    high: Int
    low: Int
    value: Int
    inclusive: Boolean = true
}

# Represents Date Range input with Boolean inclusive constraints (YYYY-MM-DD , YYYY/MM/DD, YYYY format).
input DateRange {
    high: Date
    low: Date
    value: Date
    inclusive: Boolean = true
}
