    scopeNote: String
    # Synonyms/non‑preferred terms for this concept.
    synonyms: [String]
    # Associatively related concepts.
    relatedConcepts: [Concept]
    # Narrower concepts in the thesaurus hierarchy (children).
    narrowerConcepts: [Concept]
    # Broader concepts in the thesaurus hierarchy (parents).
    broaderConcepts: [Concept]
    # Flag indicating a top member in the hierarchy (no broader term).
    isTopMember: Boolean
