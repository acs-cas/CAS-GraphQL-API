# Represents a bibliographic reference within a document that points to material outside the CAS document collection.
type ExternalCitation {
    # Last name of the first author.
    personLastName: String
    # Initial(s) of the first author's given name.
    personInitial: String
    # Corporate author name (organization as author).
    corporateAuthor: String
    # Issue number of the cited item.
    issue: String
    # Volume number of the cited item.
    volume: String
    # Publication date of the cited item.
    publicationDate: String
    # Page (start or specific page) of the cited item.
    page: String
    # Two‑letter patent office code.
    patentOfficeCode: String
    # Original patent number as presented by the office (may match normalized number).
    originalPatentNumber: String
    # Patent kind code.
    kindCode: String
    # Reference work (journal/book titles and related elements combined for display, comma‑separated).
    refWork: String
    # Short display label for the citation (source‑specific).
    label: String
    # Identifiers associated with the citation (context/value pairs such as PubMed ID).
    identifier: [ReferenceIdentifier]
}

# Represents a contextual identifier associated with a document from an external citation.
type ReferenceIdentifier {
    # Type of identifier, e.g., PubMed ID.
    context: String
    # Identifier value in that context.
    value: String
}

# ================================================================================
# 14. DOCUMENT FINDINGS
# Source file: finding.graphqls
# Cross-domain CAS-curated findings that tie substances, concepts, properties, and reactions back to the documents they were extracted from (DocumentFinding interface and its Substance/Concept/Property/Reaction finding implementations).
# ================================================================================

# Base structure for all extracted CAS value-add findings tied back to the originating document.
interface DocumentFinding {
    document: Document
}

# CAS-curated value-added finding that identifies and characterizes a substance related to the novelty mentioned within a document.
type SubstanceFinding implements DocumentFinding {
    substance: Substance
    nameInDocument: String
    modifier: String
    roles: [Role]
    superRoles: [Role]
    document: Document
}

# Describes a conceptual or controlled-vocabulary finding identified within a document.
type ConceptFinding implements DocumentFinding {

    concept: Concept
    modifier: String
    roles: [Role]
    superRoles: [Role]
    document: Document
}

# Describes a substance property found within a collection, document, or a predicted value.
 type PropertyFinding implements DocumentFinding {
     attributionCode: String
     attributionText: String
     document: Document
     substance: Substance
     property: Property
 }

# Describes a CAS-curated reaction identified within a document.
type ReactionFinding implements DocumentFinding {
    reactions: Reaction
    document: Document
 }

# Represents a controlled vocabulary role or supperrole describing the functional significance of a substance or concept within a document.
type Role {
    description: String
    code: String
}

