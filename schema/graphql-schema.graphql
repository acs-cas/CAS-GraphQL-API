# 9. PROPERTIES
# Source file: property.graphqls
# Physical/chemical property domain: propertyQuery, PropertyInput, the Property type, and the PropertyName enum of measurable property kinds.
# ================================================================================

extend type Query {
    # Searches experimental and/or predicted physical/chemical property values (e.g., melting point, boiling point, density) by substance CAS Registry Number, property name, or value range. Returns matching property records with their reported value, measurement conditions, and predicted/preferred-value flags.
    propertyQuery(propertyInput: PropertyInput, pageParameters: PageParameters): PropertyPage
}

# Describes the search inputs to query substance properties. Multiple inputs are evaluated with AND by default.
input PropertyInput {
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Name of the property being described (e.g., melting point, boiling point, density).
    name: PropertyName
    # Searchable values including ranges for a specified property.
    value: FloatRange @ValidateRange
    # Flag to include predicted property values alongside experimental values in results.
    isPredicted: Boolean
}

type SubstanceProperties {
    substance: Substance
    properties: [Property]
}

# Describes physical or predicted properties of a substance.
type Property {
    # Name of the property being described (e.g., melting point, boiling point, density).
    name: PropertyName!
    # Display value of the property, including units and formatting as reported.
    value: String!
    # Conditions under which the property was measured or predicted (e.g., temperature, pressure).
    condition: [String]
    # Indicates if this value is the preferred value for the property.
    isPreferredValue: Boolean
    # Indicates if the property value is predicted rather than experimentally measured.
    isPredicted: Boolean
    # Property finding associated with this property; includes attribution and source context.
    propertyFinding: PropertyFinding

}

