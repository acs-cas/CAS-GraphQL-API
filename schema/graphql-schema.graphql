    # Product name assigned by the supplier; may be systematic, trade, or a descriptive variant.
    name: String
    # Stock status at the time of the catalog update (e.g., Maintained in stock, Typically in stock, Limited/intermittent, Synthesis on demand).
    stockAvailability: Availability
    # Supplier-indicated time frame for shipment readiness (e.g., 1 week, 2 weeks, 4 weeks, 8 weeks, Over 8 weeks).
    shipsWithin: ShipsWithin
    # Grade label communicating suggested use or specification (e.g., NMR reference standard, for biological use, anhydrous).
    grade: String
    # Purity statement as reported (e.g., 99%, 98% GC, 97ee, Ta < 500 ppm).
    purity: String
    purityCategory: Purity
    # Flag indicating whether bulk quantities are available.
    isBulkAvailable: Boolean
    # Flag indicating whether the item is categorized as a screening compound.
    isScreeningCompound: Boolean
    # Linked substance entity when the item is represented at substance level.
    substance: Substance
    # Text indicating additional components not represented at substance level (e.g., salts, solvents, stoichiometric descriptors).
    auxiliaryComponents: String
    # Components of the catalog item (each with identifier/concept/substance/amount/function).
    catalogItemComponents: [CatalogItemComponent]
    # Supplier order number used in supplier systems or e-commerce catalogs.
    orderNumber: String
    # One or more offerings (price/quantity/scale/category), possibly with ordinal display order.
    offering: [Offering]
    # Direct supplier links (pricing & availability, general info, or other supplier-provided pages).
    supplierLink: [String]
    # Properties/attributes reported by the supplier (context + value), stored as found.
    supplierReportedProperties: [SupplierProperty]
    # Supplier name as provided for the catalog item or issue.
    supplierName: String
    # Date indicating recency (e.g., when data was provided/published).
    currentAsOf: String
    # Distributors associated with the catalog issue (name, address/location, contacts).
    distributors: [Distributor]
}

# Supplier provided synonyms or other identification aspects of a substance offering.
type AuxiliaryIdentifier {
    # Context describing type/origin (e.g., synonym, original RN, CAS RN, original name, UNII).
    context: String
    # Identifier value (words/codes/numbers) as provided by supplier.
    value: String
}

# Component within a specific catalog item.
type CatalogItemComponent {
    # Identifiers for the component (e.g., original RN/name, CAS RN, UNII) with context and value.
    identifier: [AuxiliaryIdentifier]
    # Linked substance for the component when represented at substance level.
    substance: Substance
    # Linked concepts for general subjects or non-structurable components.
    concepts: [Concept]
    # Amount text as found (e.g., “30% w/w”, “200 ppm”, “2 M”).
    amount: String
    # Role/function of the component (e.g., emulsifier, solvent).
    function: String
    # Ordinal for display order of components (1 appears first).
    ordinal: Int
}

# Organization identified by the supplier for the catalog issue.
type Distributor {
    # Distributor organization name.
    name: String
    # Address line (street).
    address: [String]
    # City/locality.
    city: String
    # Country subunit (state/province/region) when applicable.
    countrySubunit: String
    # Postal/ZIP code.
    postalCode: String
    # Country name.
    country: String
    # Contact information entries (e.g., phone, email, fax, general contact notes) as provided.
    contactInformation: JSON
}

# Substance properties provided by the supplier.
type SupplierProperty {
    # Context/label describing the property (e.g., function, melting point, description).
    name: String
    # Property value as reported by the supplier (e.g., “stabilizer”, “75 °C”, narrative text).
    value: String
}

# Describes the offering of the catalog item for sale by the supplier.
type Offering {
    # Ordinal for display order of quantity/price rows (1 appears first).
    ordinal: Int!
    # Price text as reported (number + currency), may be null if not provided.
    price: String
    # Quantity text as reported (number + unit), e.g., “10 mg”, “100 mL”, or formatted packs.
    quantity: String
    # Quantity category for sorting/grouping (e.g., Milligram, Gram, Kilogram quantities, Tons).
    quantityCategory: QuantityCategory
