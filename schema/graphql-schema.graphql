    patentApplicationNumber: String
    # Publication kind code identifying the type of patent document (e.g., A1, B2).
    kindCode: String
    # Patent application filing date.
    applicationDate: DateRange @ValidateRange
    # Person or entity that legally receives ownership rights to a patent.
    assigneeNames: String
    # International Patent Classification (IPC) codes associated with the publication.
    ipcCodes: [String]
    # Cooperative Patent Classification (CPC) codes associated with the publication.
    cpcCodes: [String]
    # Defines the legal boundaries and scope of the invention in the patent.
    claims: [String]
    # Status of the patent publication (e.g., active, withdrawn).
