# Search by author or inventor to query documents.
input PersonInfo {
    # Family/last name.
    lastName: String
    # Given/first name.
    firstName: String
    # ORCID identifier (e.g., 0000-0002-1825-0097).
    orcidID: String
}

# Defines search inputs used to query documents. Multiple inputs are evaluated with AND by default.
input DocumentInput {
    # Searchable internal/external identifiers associated with the document (e.g., DOI, accession numbers).
    id: String
    # Title text for the document; use published title when available.
    title: String
    # Searchable field that combines terms from several key fields (e.g., title, abstract, concepts).
    basicIndex: [String]
    # Document category types—at least one Primary type, optional Secondary types (e.g., Patent, Journal, Article).
