# 10. HAZARDS (GHS)
# Source file: hazard.graphqls
# GHS hazard classification domain: hazardQuery, HazardInput, HazardDesignation/HazardAssignment/HazardSymbol types, and the HazardCode enum.
# ================================================================================

extend type Query {
    # Searches GHS hazard designations by substance CAS Registry Number or hazard code (e.g., H225). Returns matching hazard designations, including signal word, pictograms, hazard statements, and the issuing authority/jurisdiction.
    hazardQuery(hazardInput: [HazardInput], pageParameters: PageParameters): HazardDesignationPage
}

# Describes the search inputs to query hazard designations. Multiple inputs are evaluated with AND by default.
input HazardInput {
    # Unique CAS Registry Number assigned to the substance.
    RN: String
    # Hazard code (e.g., “H225”, “H314”).
    code: [HazardCode]
}

# Describes a health and safety classification of a substance.
type HazardDesignation {
    # Substance to which this Hazard Designation applies; the classification, pictograms, signal word, and statements all pertain to this substance.
    substance: Substance!
    # Name of the authority that reported or published the designation (e.g., national agency, regional regulator, or supplier following GHS rules).
    assigningAuthority: String
    # CAS-assigned source-type bucket indicating the relative authority.
    authorityType: String!
    # Jurisdiction in which this designation is applicable (e.g., country, region, or treaty scope). Used to reflect local adoption/implementation of GHS.
    jurisdiction: String!
    # Short textual statement attributing or acknowledging the source of the designation
    attributionStatement: String
    # Signal word(s) indicating the severity level required under GHS (typically “Danger” or “Warning”).
    signalWord: [String]
    # Set of GHS hazard symbols/pictograms applicable to the substance (e.g., flame, corrosion, skull and crossbones).
    hazardSymbols: [HazardSymbol]!
    # Set of hazard assignments covering the GHS hazard class/category codes and their corresponding H-statements (e.g., “H225 Highly flammable liquid and vapour”). Note: field name retained as provided.
    hazardAssignments: [HazardAssignment]!
}

# Represents the classification decision by a given authority.
type HazardAssignment {
    # Hazard code (e.g., “H225”, “H314”).
    code: HazardCode
    # Hazard class/category text (e.g., “Flammable liquids; Category 2”, “Skin corrosion/irritation; Category 1A”).
    hazardClass: String
    # Hazard statement text corresponding to the code (e.g., “Highly flammable liquid and vapour”, “Causes severe skin burns and eye damage”).
    statement: String
}

# Graphical icon used to visually communicate the type of hazard associated with a substance.
type HazardSymbol {
    # Text label or code identifying the symbol (e.g., “Flame”, “Corrosion”, “GHS02”).
    symbol: String
    # Identifier for the pictogram asset representing the symbol per GHS conventions.
    hazardPictograph: String
}

