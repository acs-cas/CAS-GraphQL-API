# Describes the input arguments to control the paginated data that is retrieved.
input PageParameters {
    # Specifies which page of results to retrieve. Must be a positive integer starting from 1. This is used for pagination through large result sets. If PageParams are omitted, defaults to 1
    page: Int = 1 @Min(value: 1)
    # Controls how many items are displayed per page. Value must be between 1 and 100. Smaller values load faster while larger values require fewer page loads. If PageParams are omitted, defaults to 100
    pageSize: Int = 100 @Range(min: 1, max: 100)
}

# Describes context about a paginated result set.
type PageInformation {
    # Whether there is a next page available
    hasNextPage: Boolean
    # Current page number
    currentPage: Int
    # Whether there is a previous page available
    hasPreviousPage: Boolean
    # Number of items in each page
    pageSize: Int
    # Total number of items across all pages
    totalItems: Int
    # Total number of pages available
    totalPages: Int
}

interface Page {
    pageInformation: PageInformation
}

type DocumentPage implements Page {
    documents: [Document]
    pageInformation: PageInformation
}

type SubstancePage implements Page {
    substances: [Substance]
    pageInformation: PageInformation
}

type BiosequencePage implements Page {
