}

# Simple NOT: excludes a specific solvent.
query NotSolventAcetone {
  reactionQuery(
    whereReaction: { not: { reactionInput: { reactionParticipant: [{ RN: "67-64-1", role: SOLVENT }] } } }
    pageParameters: { page: 1, pageSize: 10 }
  ) {
    reactions {
      id
      reactionType
      stages { solvents { substance { RN displayName } } }
      products { yield }
    }
    pageInformation { totalItems }
  }
}

# OR of two ANDs: (toluene reactant AND acetone solvent) OR (ethanol
# reactant AND water solvent).
query TolueneAcetoneOrEthanolWater {
  reactionQuery(
    whereReaction: {
      or: [
        {
          and: [
            { reactionInput: { reactionParticipant: [{ RN: "108-88-3", role: REACTANT }] } }
            { reactionInput: { reactionParticipant: [{ RN: "67-64-1", role: SOLVENT }] } }
          ]
        }
        {
          and: [
            { reactionInput: { reactionParticipant: [{ RN: "64-17-5", role: REACTANT }] } }
            { reactionInput: { reactionParticipant: [{ RN: "7732-18-5", role: SOLVENT }] } }
          ]
        }
      ]
    }
    pageParameters: { page: 1, pageSize: 15 }
  ) {
    reactions {
      id
      reactionType
      stages {
        reactants { substance { RN displayName } }
        solvents { substance { RN displayName } }
      }
      products { yield }
    }
    pageInformation { totalItems }
  }
}

# NOT wrapping an OR: excludes reactions matching either a temperature
# range or a pressure range.
query NotTemperatureOrPressureRange {
  reactionQuery(
    whereReaction: {
      not: {
        or: [
          { reactionInput: { conditions: { temperature: { value: { low: 20, high: 30 }, unit: CELSIUS } } } }
          { reactionInput: { conditions: { pressure: { value: { low: 9, high: 10 }, unit: ATM } } } }
        ]
      }
    }
    pageParameters: { page: 1, pageSize: 10 }
  ) {
    reactions {
      id
      reactionType
      stages { conditions { temperature pressure } }
      products { yield }
    }
    pageInformation { totalItems }
  }
}

# AND containing a nested OR, plus a NOT: a reactant AND (a short OR a
# long duration range) AND NOT a specific catalyst.
query WithDurationOrExcludeCatalystCopper {
  reactionQuery(
    whereReaction: {
      and: [
        { reactionInput: { reactionParticipant: [{ RN: "62107-82-8", role: REACTANT }] } }
        {
          or: [
            { reactionInput: { conditions: { duration: { value: { low: 1, high: 6 }, unit: HOURS } } } }
            { reactionInput: { conditions: { duration: { value: { low: 12, high: 24 }, unit: HOURS } } } }
          ]
        }
        { not: { reactionInput: { reactionParticipant: [{ RN: "7440-50-8", role: CATALYST }] } } }
      ]
    }
    pageParameters: { page: 1, pageSize: 10 }
  ) {
    reactions {
      id
      reactionType
      stages {
        reactants { substance { RN displayName } }
        catalysts { substance { RN displayName } }
        conditions { duration }
      }
      products { yield }
    }
    pageInformation { totalItems }
  }
}

# Deep nesting: AND( OR( AND(reactant,catalyst), AND(reactant,reactant) ),
# NOT( OR(failed, high-pressure) ) ) -- two alternative reaction pathways,
# both still subject to the same exclusions.
query DeepNestedAlcoholPathwaysExcludeFailedOrHighPressure {
  reactionQuery(
    whereReaction: {
      and: [
        {
          or: [
            {
              and: [
                { reactionInput: { reactionParticipant: [{ RN: "64-17-5", role: REACTANT }] } }
                { reactionInput: { reactionParticipant: [{ RN: "7440-50-8", role: CATALYST }] } }
              ]
            }
            {
              and: [
                { reactionInput: { reactionParticipant: [{ RN: "67-56-1", role: REACTANT }] } }
                { reactionInput: { reactionParticipant: [{ RN: "71-23-8", role: REACTANT }] } }
              ]
            }
          ]
        }
        {
          not: {
            or: [
              { reactionInput: { reactionType: FAILED } }
              { reactionInput: { conditions: { pressure: { value: { low: 9, high: 10 }, unit: ATM } } } }
            ]
          }
        }
      ]
    }
    pageParameters: { page: 1, pageSize: 20 }
  ) {
    reactions {
      id
      reactionType
      stages {
        reactants { substance { RN displayName } }
        catalysts { substance { RN displayName } }
        conditions { pressure }
      }
      products { yield }
    }
    pageInformation { totalItems }
  }
}
