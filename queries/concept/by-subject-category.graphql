# Search concepts by controlled subject category.
query ConceptBySubjectCategory($input: ConceptInput) {
  conceptQuery(conceptInput: $input, pageParameters: { page: 1, pageSize: 3 }) {
    concept {
      afk
      preferredName
      subjectCategory
      isTopMember
    }
    pageInformation {
      totalItems
    }
  }
}

