# Narrow a substanceInput search by a cross-domain hazardInput. substanceInput
# combines correctly with hazardInput/propertyInput/documentInput/catalogInput.
query FormulaPlusHazard($s: [SubstanceInput], $h: [HazardInput]) {
  substanceQuery(substanceInput: $s, hazardInput: $h, pageParameters: { page: 1, pageSize: 5 }) {
    substances {
      RN
      preferredName
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# {
#   "s": [{ "molecularFormula": "C9H8O4" }],
#   "h": [{ "code": "H319" }]
# }
#
# molecularFormula alone: 1133 results. Adding hazardInput H319 (eye
# irritation) narrows to 51 -- a proper subset, confirming AND semantics
# across the two top-level input types.
