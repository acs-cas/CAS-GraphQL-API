# Narrow a substanceInput search by a cross-domain hazardInput. Confirms
# the substanceQuery cross-domain combination bug (substanceInput +
# hazardInput/propertyInput/documentInput/catalogInput -> INTERNAL_ERROR)
# is fixed as of this date -- it previously errored on every combination.
# Verified against the live API 2026-09-23.
query FormulaPlusHazard($s: [SubstanceInput], $h: [HazardInput]) {
  substanceQuery(substanceInput: $s, hazardInput: $h, pageParameters: { page: 1, pageSize: 5 }) {
    substances {
      RN
      preferredName
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# {
#   "s": [{ "molecularFormula": "C9H8O4" }],
#   "h": [{ "code": "H319" }]
# }
#
# molecularFormula alone: 1133 results. Adding hazardInput H319 (eye
# irritation) narrows to 51 -- a proper subset, confirming AND semantics
# across the two top-level input types.
