# Similarity search: find substances structurally similar to a given
# structure (not exact or substructure matches).
# Verified against the live API 2026-09-28.
query SimilaritySearch($input: [SubstanceInput]) {
  substanceQuery(substanceInput: $input, pageParameters: { page: 1, pageSize: 100 }) {
    substances {
      RN
      preferredName
      molecularFormula
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# { "input": [{ "structure": { "SMILES": "CCO", "searchType": "SIMILARITY" } }] }
