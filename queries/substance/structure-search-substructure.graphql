# Substructure search: find substances containing a given fragment.
# Verified against the live API 2026-09-28. Note: a bare benzene ring
# (c1ccccc1) as the substructure timed out -- too common/broad a fragment.
# A larger, more specific substructure (this acridine-like tricyclic
# core) responds quickly.
query SubstructureSearch($input: [SubstanceInput]) {
  substanceQuery(substanceInput: $input, pageParameters: { page: 1, pageSize: 100 }) {
    substances {
      RN
      preferredName
      molecularFormula
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# { "input": [{ "structure": { "SMILES": "c1ccc2c(c1)cc1ccccc1n2", "searchType": "SUBSTRUCTURE" } }] }
