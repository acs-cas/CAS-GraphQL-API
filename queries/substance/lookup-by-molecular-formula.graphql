# Find all substances matching a molecular formula (Hill notation).
query MolecularFormulaSearch($input: [SubstanceInput]) {
  substanceQuery(substanceInput: $input, pageParameters: { page: 1, pageSize: 3 }) {
    substances {
      RN
      preferredName
      molecularFormula
      molecularWeight
      substanceClasses
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# { "input": [{ "molecularFormula": "C6H15N" }] }
