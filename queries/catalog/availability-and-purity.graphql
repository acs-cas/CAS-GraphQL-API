# Narrow supplier listings for a substance to those in stock and at the
# highest purity category.
query CatalogAvailabilityPurity($input: [CatalogInput]) {
  catalogQuery(catalogInput: $input, pageParameters: { page: 1, pageSize: 3 }) {
    catalogItems {
      name
      supplierName
      stockAvailability
      purityCategory
    }
    pageInformation {
      totalItems
    }
  }
}

