# Retrieve physical/chemical properties for a substance identified by common or trade name.
# CAS resolves synonyms to the canonical registry entry.
# Example: "Actimoxi" resolves to Amoxicillin, returning 100 properties.
query propertyQuery($name: String) {
  substanceQuery(substanceInput: { name: $name }) {
    substances {
      preferredName
      propertyPage {
        properties {
          name
          value
          condition
          isPredicted
        }
      }
    }
  }
}

# Variables:
# { "name": "Actimoxi" }
