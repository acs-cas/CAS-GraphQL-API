# Screen a compound for GHS hazard designations across regulatory authorities, by CAS
# Registry Number -- supports SDS generation or supply-chain risk screening.
# Verified against the live API 2026-09-30 (Benzene, RN 71-43-2, 443 total designations).
query hazardQuery($rn: String) {
  substanceQuery(substanceInput: { RN: $rn }) {
    substances {
      preferredName
      hazardDesignationPage {
        hazardDesignations {
          assigningAuthority
          authorityType
          jurisdiction
          signalWord
          hazardAssignments {
            code
            hazardClass
            statement
          }
        }
        pageInformation { totalItems }
      }
    }
  }
}

# Variables:
# { "rn": "71-43-2" }
