# Search documents by author/inventor name.
query PersonSearch($first: String = "", $last: String, $pageNumber: Int = 1, $pageSize: Int = 5) {
  documentQuery(
    documentInput: { person: { lastName: $last, firstName: $first } }
    pageParameters: { page: $pageNumber, pageSize: $pageSize }
  ) {
    documents {
      title
      docType
    }
    pageInformation {
      totalItems
    }
  }
}

