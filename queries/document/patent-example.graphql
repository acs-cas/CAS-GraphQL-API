# Search patents by title keyword, selecting patent-specific fields via an
# inline fragment on the concrete Patent type.
query PatentExample($doc: [DocumentInput]) {
  documentQuery(documentInput: $doc, pageParameters: { page: 1, pageSize: 2 }) {
    documents {
      title
      docType
      publicationDate
      ... on Patent {
        patentNumber
        patentOffice
        assigneeNames
        inventorNames
      }
    }
    pageInformation {
      totalItems
    }
  }
}

# Variables:
# { "doc": [{ "docType": "PATENT", "title": "aspirin" }] }
