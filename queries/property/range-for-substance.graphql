# Find a substance's property values within a range (RN-scoped).
query PropertyRangeForRN($input: PropertyInput) {
  propertyQuery(propertyInput: $input, pageParameters: { page: 1, pageSize: 5 }) {
    properties {
      name
      value
      isPredicted
      isPreferredValue
    }
    pageInformation {
      totalItems
    }
  }
}

